name: Wind Report

on:
  workflow_dispatch:
    inputs:
      start_datetime:
        description: "Start date & time, SGT (YYYY-MM-DDTHH:MM)"
        required: true
        default: "2026-09-12T08:00"
      end_datetime:
        description: "End date & time, inclusive, SGT (YYYY-MM-DDTHH:MM)"
        required: true
        default: "2026-09-12T09:00"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests numpy matplotlib jinja2

      - name: Fetch data and build site
        env:
          NEA_API_KEY: ${{ secrets.NEA_API_KEY }}
          START_DATETIME: ${{ inputs.start_datetime }}
          END_DATETIME:   ${{ inputs.end_datetime }}
        run: python scripts/build.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          commit_message: "report: ${{ inputs.start_datetime }} to ${{ inputs.end_datetime }} SGT"
