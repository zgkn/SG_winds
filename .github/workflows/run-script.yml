name: Wind Report

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date to analyse (YYYY-MM-DD, SGT)"
        required: true
        default: "2026-09-12"
      hour_start:
        description: "Start hour (0-23, SGT)"
        required: true
        default: "8"
      hour_end:
        description: "End hour inclusive (0-23, SGT)"
        required: true
        default: "9"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests numpy matplotlib jinja2

      - name: Fetch data and build site
        env:
          NEA_API_KEY: ${{ secrets.NEA_API_KEY }}
          REPORT_DATE: ${{ inputs.date }}
          HOUR_START:  ${{ inputs.hour_start }}
          HOUR_END:    ${{ inputs.hour_end }}
        run: python scripts/build.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          commit_message: "report: ${{ inputs.date }} ${{ inputs.hour_start }}h–${{ inputs.hour_end }}h SGT"
